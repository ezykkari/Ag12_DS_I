<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Aqui fica o nome que aparece lá na aba do navegador -->
    <title>Meus sites favoritos</title>

    <style>

        /* Dei uma personalizada básica pra página não ficar sem graça */
        body {
            background-color: #f2f2f2;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        /* Título principal da página */
        h1 {
            color: #222;
            margin-bottom: 40px;
        }

        /* Essa parte organiza cada bloco dos sites */
        .site {
            background-color: white;
            width: 320px;
            margin: 20px auto;
            padding: 15px;
            border-radius: 12px;

            /* Coloquei sombra pra deixar mais bonito visualmente */
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        /* Ajuste das imagens */
        img {
            width: 250px;
            border-radius: 10px;
        }

        /* Estilo dos links */
        a {
            text-decoration: none;
            color: blue;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        /* Pequeno efeito quando toca no link */
        a:hover {
            color: red;
        }

    </style>
</head>

<body>

    <!-- Coloquei meu nome no título igual a atividade pediu -->
    <h1>Meus sites favoritos: Ezequiel</h1>

    <!-- Discord -->
    <div class="site">

        <!-- Nome do site -->
        <h2>Discord</h2>

        <!-- A imagem também funciona como link -->
        <a href="https://discord.com/" target="_blank">
            <img src="discord.jpg" alt="Discord">
        </a>

        <!-- Link do site -->
        <a href="https://discord.com/" target="_blank">
            https://discord.com/
        </a>

    </div>

    <!-- YouTube -->
    <div class="site">

        <!-- Um dos sites que eu mais uso pra vídeos -->
        <h2>YouTube</h2>

        <a href="https://www.youtube.com/" target="_blank">
            <img src="youtube.jpg" alt="YouTube">
        </a>

        <a href="https://www.youtube.com/" target="_blank">
            https://www.youtube.com/
        </a>

    </div>

    <!-- Netflix -->
    <div class="site">

        <!-- Site de filmes e séries -->
        <h2>Netflix</h2>

        <a href="https://www.netflix.com/br/" target="_blank">
            <img src="netflix.jpg" alt="Netflix">
        </a>

        <a href="https://www.netflix.com/br/" target="_blank">
            https://www.netflix.com/br/
        </a>

    </div>

    <!-- Spotify -->
    <div class="site">

        <!-- Uso bastante pra ouvir música -->
        <h2>Spotify</h2>

        <a href="https://open.spotify.com/" target="_blank">
            <img src="spotify.jpg" alt="Spotify">
        </a>

        <a href="https://open.spotify.com/" target="_blank">
            https://open.spotify.com/
        </a>

    </div>

    <!-- Pinterest -->
    <div class="site">

        <!-- Gosto bastante pelas ideias e inspirações -->
        <h2>Pinterest</h2>

        <a href="https://br.pinterest.com/" target="_blank">
            <img src="pinterest.jpg" alt="Pinterest">
        </a>

        <a href="https://br.pinterest.com/" target="_blank">
            https://br.pinterest.com/
        </a>

    </div>

</body>

</html>
